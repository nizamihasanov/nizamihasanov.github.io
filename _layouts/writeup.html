---
layout: default
---

<article class="writeup">

  <h1>{{ page.title }}</h1>

  <p class="meta">
    {{ page.date | date: "%B %d, %Y" }}
    {% if page.tags %}
      • Tags:
      {% for tag in page.tags %}
        <span class="tag">{{ tag }}</span>
      {% endfor %}
    {% endif %}
  </p>

  <hr>

  {{ content }}

</article>
